<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Тизер B «Угадай калории»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Кадр 540×960 CSS-пикселей, снимается с масштабом 2 → 1080×1920.
   Состояние считается из времени t в render(t). Пары НЕ из игры, ответы не показываются.
   window.EVENTS — моменты для звуков (вжух, тик, звонок), по ним собирается звуковая дорожка. */
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#081028}
#stage{position:relative;width:540px;height:960px;overflow:hidden;color:#F6EDE0;font-family:Manrope,sans-serif;
  background:radial-gradient(90% 55% at 50% -8%,#1B2E66 0%,transparent 70%),linear-gradient(118deg,transparent 18%,rgba(70,100,190,.16) 32%,transparent 46%),linear-gradient(180deg,#0E1A3D 0%,#081028 55%,#050A1C 100%)}
#dust{position:absolute;inset:0;width:540px;height:960px}
.layer{position:absolute;inset:0;display:none}
.gold{background:linear-gradient(180deg,#F8E0BC 0%,#E3AE76 52%,#B06D40 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph{border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(233,185,131,.55),0 18px 40px -12px rgba(0,0,0,.8)}
/* hook */
#hook .t1{position:absolute;top:110px;left:20px;right:20px;text-align:center;font:400 74px/1.02 Forum,serif}
#hook .hp{position:absolute;top:560px;width:200px;height:200px}
#hook .hv{position:absolute;top:618px;left:228px;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#F8E0BC,#E3AE76);color:#0A1330;font:800 22px Manrope;box-shadow:0 0 0 8px #0B1534}
#hook .t2{position:absolute;top:380px;left:30px;right:30px;text-align:center;font:800 36px/1.22 Manrope}
#hook .t2 b{color:#F8E0BC}
/* pairs */
.counter{position:absolute;top:96px;left:0;right:0;text-align:center;font:800 18px Manrope;letter-spacing:.2em;color:#E9B983}
.q{position:absolute;top:126px;left:20px;right:20px;text-align:center;font:800 38px/1.15 Manrope}
.row{position:absolute;left:24px;right:24px;height:226px;display:flex;align-items:center;gap:18px;padding:0 18px;border-radius:30px;border:2px solid rgba(233,185,131,.22);background:rgba(255,255,255,.04)}
.row.r1{top:250px} .row.r2{top:520px}
.row .ph{width:180px;height:180px;flex:none}
.row .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.row .nm{font:800 32px/1.1 Manrope}
.row .pt{font:700 21px/1.2 Manrope;color:#C4CADD}
.row .kc{font:400 66px/1 Forum,serif;color:#F8E0BC;margin-top:4px}
.row .kc small{font:800 20px Manrope;color:#C4CADD;margin-left:6px}
.vs{position:absolute;left:132px;top:456px;width:84px;height:84px;margin-left:-42px;border-radius:50%;display:grid;place-items:center;z-index:3;
  background:linear-gradient(180deg,#F8E0BC,#E3AE76);color:#0A1330;font:800 40px Manrope;box-shadow:0 0 0 8px #0B1534,0 10px 30px -8px rgba(227,174,118,.7)}
.ring{position:absolute;inset:-8px;border-radius:50%}
.cap{position:absolute;top:772px;left:24px;right:24px;text-align:center;font:800 29px/1.3 Manrope}
.cap b{color:#F8E0BC}
.cap small{display:block;font:700 18px/1.3 Manrope;color:#C4CADD;margin-top:6px}
.tag{position:absolute;top:-16px;right:22px;font:800 17px/1 Manrope;letter-spacing:.08em;padding:8px 14px;border-radius:99px;background:#8ED477;color:#0A1330;opacity:0}
/* end */
#end .logo{position:absolute;top:110px;left:50%;width:160px;height:160px;margin-left:-80px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #E3AE76,0 20px 50px -10px rgba(0,0,0,.8)}
#end .t1{position:absolute;top:300px;left:24px;right:24px;text-align:center;font:400 58px/1.05 Forum,serif}
#end .btn{position:absolute;top:620px;left:50px;right:50px;height:96px;border-radius:99px;display:grid;place-items:center;font:800 32px Manrope;color:#0A1330;
  background:linear-gradient(180deg,#F8E0BC,#E3AE76 55%,#B06D40);box-shadow:0 14px 40px -10px rgba(227,174,118,.7)}
#end .arrow{position:absolute;top:732px;left:0;right:0;text-align:center;font-size:54px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="dust" width="1080" height="1920"></canvas>

  <div id="hook" class="layer">
    <div class="t1 gold" id="ht1">Проверим, какой ты нутрициолог?</div>
    <div class="t2" id="ht2">Спорим, не угадаешь,<br><b>что калорийнее?</b></div>
    <img class="ph hp" id="hpa" src="img/granola.webp" style="left:28px"><img class="ph hp" id="hpb" src="img/burger.webp" style="left:312px"><div class="hv" id="hv">или</div>
  </div>

  <div id="pairs" class="layer">
    <div class="counter" id="pc"></div>
    <div class="q" id="pq">Что калорийнее?</div>
    <div class="row r1" id="ra"><img class="ph" id="ia"><div class="tx"><div class="nm" id="na"></div><div class="pt" id="pa"></div><div class="kc"><span id="va">?</span><small>ккал</small></div></div><div class="tag" id="tag">БОЛЬШЕ</div></div>
    <div class="row r2" id="rb"><img class="ph" id="ib"><div class="tx"><div class="nm" id="nb"></div><div class="pt" id="pb"></div><div class="kc"><span id="vb">?</span><small>ккал</small></div></div></div>
    <div class="vs" id="vs"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#F8E0BC" stroke-width="4" stroke-linecap="round" id="ring" transform="rotate(-90 50 50)" stroke-dasharray="295.3" stroke-dashoffset="0"/></svg><span id="cd">или</span></div>
    <div class="cap" id="cap"></div>
  </div>

  <div id="end" class="layer">
    <img class="logo" id="elogo" src="../ugaday/logo.webp">
    <div class="t1 gold" id="et1">Проверь свой<br>уровень нутрициолога<br>в&nbsp;игре</div>
    <div class="btn" id="ebtn">Ссылка под видео</div>
    <div class="arrow" id="earr">👇</div>
  </div>
</div>

<script>
const PAIRS=[
  {a:{img:'granola',n:'Гранола',p:'стакан'}, b:{img:'burger',n:'Чизбургер',p:'1 штука'}},
  {a:{img:'chips',n:'Банановые чипсы',p:'горсть, 70 г'}, b:{img:'bar',n:'Батончик',p:'шоколадный, 50 г'}},
  {a:{img:'cashew',n:'Кешью',p:'горсть, 60 г'}, b:{img:'donut',n:'Пончик в глазури',p:'1 штука'}},
  {a:{img:'smoothie',n:'Смузи',p:'большой стакан, 400 мл'}, b:{img:'pizza',n:'Пицца',p:'1 кусок'}},
];
const HOOK=2.6, DUR=[4.6,2.1,1.9,1.8], END=4.2;   // пары ускоряются
const STARTS=DUR.reduce((a,d,i)=>(a.push(i?a[i-1]+DUR[i-1]:HOOK),a),[]);
const T_END=STARTS[STARTS.length-1]+DUR[DUR.length-1], DURATION=T_END+END;
// countdown inside a pair: starts at 0.35s, ends 0.4s before the pair ends
const cdWin=i=>i===0?[0.35,1.95]:[0.35, DUR[i]-0.45];
const REVEAL={a:'≈500',b:'≈300',cap:'Гранола — <b>до 2 раз</b> калорийнее!',small:'стакан гранолы 420–600 ккал, чизбургер около 300'};

const EVENTS=[{t:0.05,type:'whoosh'},{t:0.95,type:'pop'}];
STARTS.forEach((s,i)=>{ EVENTS.push({t:s,type:'whoosh'}); const [a,b]=cdWin(i); for(let k=0;k<3;k++) EVENTS.push({t:s+a+(b-a)*k/3,type:'tick'}); EVENTS.push({t:s+b,type:i===0?'ding':'buzz'}); });
EVENTS.push({t:T_END,type:'whoosh'},{t:T_END+0.75,type:'ding'});

const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,3);
const backOut=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
function show(el,o,ty=0,sc=1){ el.style.opacity=o; el.style.transform=`translateY(${ty}px) scale(${sc})`; }
function scene(id,on){ $(id).style.display=on?'block':'none'; }

const dust=$('#dust'), dx=dust.getContext('2d');
let seed=11; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const motes=Array.from({length:90},()=>({x:rnd()*1080,y:rnd()*1920,r:rnd()*3+1,s:rnd()*30+10,a:rnd()*.5+.15,ph:rnd()*6.28}));
function drawDust(t){ dx.clearRect(0,0,1080,1920); for(const m of motes){ const y=(m.y-t*m.s*2+19200)%1920; dx.fillStyle=`rgba(233,185,131,${m.a*(.6+.4*Math.sin(t*2+m.ph))})`; dx.beginPath(); dx.arc(m.x+Math.sin(t+m.ph)*12,y,m.r,0,7); dx.fill(); } }

let curPair=-1;
function setPair(i){ if(i===curPair) return; curPair=i; const p=PAIRS[i];
  $('#ia').src=`img/${p.a.img}.webp`; $('#ib').src=`img/${p.b.img}.webp`;
  $('#na').textContent=p.a.n; $('#pa').textContent=p.a.p; $('#nb').textContent=p.b.n; $('#pb').textContent=p.b.p;
  $('#pc').textContent=`ПАРА ${i+1} ИЗ ${PAIRS.length}`; }

function render(t){
  drawDust(t);
  scene('#hook', t<HOOK);
  if(t<HOOK){
    $('#hook').style.opacity=1-prog(t,HOOK-0.25,HOOK);
    show($('#ht1'),prog(t,0,0.25),lerp(30,0,easeOut(prog(t,0,0.45))),lerp(.85,1,backOut(prog(t,0,0.5))));
    [['#hpa',-1,0],['#hpb',1,0.08]].forEach(([s,d,dl])=>{const p=backOut(prog(t,dl,0.45+dl)); const el=$(s); el.style.opacity=prog(t,dl,0.25+dl); el.style.transform=`translateX(${(1-p)*d*300}px) rotate(${Math.sin(t*1.6+d)*4}deg) translateY(${Math.sin(t*2+d)*6}px)`;});
    show($('#hv'),prog(t,0.3,0.5),0,backOut(prog(t,0.3,0.7)));
    show($('#ht2'),prog(t,0.9,1.15),lerp(18,0,easeOut(prog(t,0.9,1.3))),lerp(.9,1,backOut(prog(t,0.9,1.3)))*(1+0.025*Math.sin(Math.max(0,t-1.3)*8)));
  }
  const inPairs = t>=HOOK && t<T_END; scene('#pairs', inPairs);
  if(inPairs){
    let i=STARTS.length-1; while(t<STARTS[i]) i--; const lt=t-STARTS[i], D=DUR[i]; setPair(i);
    const last=i===PAIRS.length-1;
    $('#pairs').style.opacity = i===0 ? prog(lt,0,0.15) : (last ? 1-prog(lt,D-0.2,D) : 1);
    $('#pq').textContent = i===0 ? 'Что калорийнее?' : 'Без подсказок 👀';
    show($('#pq'),i===0?prog(lt,0,0.25):(i===1?prog(lt,0,0.2):1));
    const rv = i===0 ? prog(lt,1.95,2.5) : 0, shown = i===0 && lt>=1.95;
    $('#va').textContent = shown ? REVEAL.a : '?'; $('#vb').textContent = shown ? REVEAL.b : '?';
    $('#tag').style.opacity = i===0 ? prog(lt,2.0,2.2) : 0;
    $('#ra').style.borderColor = shown ? '#E9B983' : ''; $('#ra').style.boxShadow = shown ? '0 0 0 2px #E9B983,0 20px 50px -14px rgba(227,174,118,.8)' : 'none';
    $('#rb').style.filter = shown ? `opacity(${lerp(1,.5,rv)})` : 'none';
    const cap=$('#cap'); if(i===0){ cap.innerHTML=REVEAL.cap+'<small>'+REVEAL.small+'</small>'; show(cap,prog(lt,2.2,2.5),lerp(16,0,easeOut(prog(lt,2.2,2.6)))); } else show(cap,0);
    const ia=backOut(prog(lt,0,0.32)), ib=backOut(prog(lt,0.06,0.38)), out=easeOut(prog(lt,D-0.16,D));
    $('#ra').style.transform=`translateX(${(1-ia)*-560 + (last?0:out*-560)}px)`; $('#ra').style.opacity=clamp(ia*1.5);
    $('#rb').style.transform=`translateX(${(1-ib)*560 + (last?0:out*560)}px)`; $('#rb').style.opacity=clamp(ib*1.5);
    const [a,b]=cdWin(i), cdT=lt-a, span=b-a; let label='или', off=0;
    if(cdT>=0 && cdT<span){ label=String(3-Math.floor(cdT/span*3)); off=295.3*(cdT/span); } else if(cdT>=span){ label='?'; off=295.3; }
    $('#cd').textContent=label; $('#ring').setAttribute('stroke-dashoffset',off.toFixed(1));
    const ph=(cdT/span*3)%1, pulse = cdT>=0&&cdT<span ? 1+0.18*Math.max(0,1-ph*4) : (cdT>=span? 1+0.12*Math.max(0,1-(cdT-span)*5):1);
    $('#vs').style.transform=`scale(${pulse*backOut(prog(lt,0.1,0.35))*(i===0?1-easeOut(prog(lt,2.0,2.3)):1)})`;
  }
  const et=t-T_END; scene('#end',et>=0);
  if(et>=0){
    show($('#elogo'),prog(et,0,0.3),0,backOut(prog(et,0,0.5)));
    show($('#et1'),prog(et,0.15,0.45),lerp(20,0,easeOut(prog(et,0.15,0.6))));
    show($('#ebtn'),prog(et,0.6,0.85),0,backOut(prog(et,0.6,1.0))*(1+0.035*Math.sin(Math.max(0,et-1.0)*6)));
    show($('#earr'),prog(et,0.9,1.1),Math.abs(Math.sin(Math.max(0,et-1.1)*4))*14);
  }
}
window.DURATION=DURATION; window.EVENTS=EVENTS; window.render=render; render(0);
</script>
</body>
</html>
