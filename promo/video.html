<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Промо-видео «Угадай калории»</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Manrope:wght@600;700;800&display=swap">
<style>
/* Кадр 540×960 CSS-пикселей, снимается с масштабом 2 → 1080×1920.
   Всё состояние считается из времени t в render(t), без CSS-переходов,
   чтобы каждый кадр рендерился одинаково. */
*{box-sizing:border-box;margin:0}
html,body{width:540px;height:960px;overflow:hidden;background:#081028}
#stage{position:relative;width:540px;height:960px;overflow:hidden;color:#F6EDE0;font-family:Manrope,sans-serif;
  background:radial-gradient(90% 55% at 50% -8%,#1B2E66 0%,transparent 70%),linear-gradient(118deg,transparent 18%,rgba(70,100,190,.16) 32%,transparent 46%),linear-gradient(180deg,#0E1A3D 0%,#081028 55%,#050A1C 100%)}
#dust{position:absolute;inset:0}
.layer{position:absolute;inset:0}
.gold{background:linear-gradient(180deg,#F8E0BC 0%,#E3AE76 52%,#B06D40 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
/* hook */
#hook .t1{position:absolute;top:140px;left:0;right:0;text-align:center;font:400 78px/1.02 Forum,serif}
#hook .t2{position:absolute;top:350px;left:30px;right:30px;font:800 32px/1.25 Manrope;text-align:center}
#hook .ph{position:absolute;width:175px;height:175px}
/* pair */
.pairscene .lbl{position:absolute;top:96px;left:0;right:0;text-align:center;font:800 18px Manrope;letter-spacing:.2em;color:#E9B983}
.pairscene .q{position:absolute;top:128px;left:28px;right:28px;text-align:center;font:800 36px/1.18 Manrope}
.row{position:absolute;left:24px;right:24px;height:226px;display:flex;align-items:center;gap:18px;padding:0 18px;border-radius:30px;border:2px solid rgba(233,185,131,.22);background:rgba(255,255,255,.04)}
.row.r1{top:250px} .row.r2{top:520px}
.row .ph{width:180px;height:180px;flex:none}
.row .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.row .nm{font:800 32px/1.1 Manrope}
.row .pt{font:700 21px/1.2 Manrope;color:#C4CADD}
.row .kc{font:400 66px/1 Forum,serif;color:#F8E0BC;margin-top:4px}
.row .kc small{font:800 20px Manrope;color:#C4CADD;margin-left:6px}
.ph{border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px rgba(233,185,131,.55),0 18px 40px -12px rgba(0,0,0,.8)}
.vs{position:absolute;left:132px;top:456px;width:84px;height:84px;margin-left:-42px;border-radius:50%;display:grid;place-items:center;z-index:3;
  background:linear-gradient(180deg,#F8E0BC,#E3AE76);color:#0A1330;font:800 40px Manrope;box-shadow:0 0 0 8px #0B1534,0 10px 30px -8px rgba(227,174,118,.7)}
.ring{position:absolute;inset:-8px;border-radius:50%}
.cap{position:absolute;top:772px;left:30px;right:30px;text-align:center;font:800 27px/1.3 Manrope}
.cap b{color:#F8E0BC}
.tag{position:absolute;top:-16px;right:22px;font:800 17px/1 Manrope;letter-spacing:.08em;padding:8px 14px;border-radius:99px;background:#8ED477;color:#0A1330}
/* cliff */
.cliff{position:absolute;top:772px;left:20px;right:20px;text-align:center}
.cliff .a{font:400 54px/1.05 Forum,serif}
.cliff .b{font:800 24px/1.3 Manrope;margin-top:8px}
/* end */
#end .logo{position:absolute;top:120px;left:50%;width:170px;height:170px;margin-left:-85px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px #E3AE76,0 20px 50px -10px rgba(0,0,0,.8)}
#end .t1{position:absolute;top:330px;left:0;right:0;text-align:center;font:400 74px/1.02 Forum,serif}
#end .t2{position:absolute;top:520px;left:40px;right:40px;text-align:center;font:800 30px/1.3 Manrope}
#end .btn{position:absolute;top:640px;left:50px;right:50px;height:92px;border-radius:99px;display:grid;place-items:center;font:800 27px Manrope;color:#0A1330;
  background:linear-gradient(180deg,#F8E0BC,#E3AE76 55%,#B06D40);box-shadow:0 14px 40px -10px rgba(227,174,118,.7)}
#end .url{position:absolute;top:756px;left:0;right:0;text-align:center;font:700 17px Manrope;color:#E9B983}
</style>
</head>
<body>
<div id="stage">
  <canvas id="dust" width="1080" height="1920"></canvas>

  <div id="hook" class="layer">
    <img class="ph" id="h1" src="../ugaday/img/avocado.webp">
    <img class="ph" id="h2" src="../ugaday/img/beer.webp">
    <img class="ph" id="h3" src="../ugaday/img/honey.webp">
    <img class="ph" id="h4" src="../ugaday/img/seeds.webp">
    <div class="t1 gold" id="ht1">Спорим,<br>ошибёшься?</div>
    <div class="t2" id="ht2">Где больше калорий?<br>3 секунды на ответ</div>
  </div>

  <div id="pairs"></div>

  <div id="end" class="layer">
    <img class="logo" id="elogo" src="../ugaday/logo.webp">
    <div class="t1 gold" id="et1">Угадай<br>калории</div>
    <div class="t2" id="et2">10 пар с подвохом.<br>Сколько угадаешь ты?</div>
    <div class="btn" id="ebtn">Играть — ссылка ниже</div>
    <div class="url" id="eurl">foodhacklab-pitanie.github.io/prognoz/ugaday</div>
  </div>
</div>

<script>
const PAIRS=[
  {q:'Ложка мёда или ложка сахара?', a:{img:'honey',n:'Мёд',p:'1 столовая ложка',k:64}, b:{img:'sugar',n:'Сахар',p:'1 столовая ложка',k:48},
   cap:'Мёд тяжелее: в ложке <b>21 г</b>, а сахара — <b>12,5 г</b>'},
  {q:'Семечки под сериал или полбатона?', a:{img:'seeds',n:'Семечки',p:'100 г очищенных',k:584}, b:{img:'bread',n:'Белый хлеб',p:'полбатона, 200 г',k:532},
   cap:'Сто граммов семечек — <b>больше полбатона</b>'},
  {q:'Финал. Пиво или куриная грудка?', a:{img:'beer',n:'Пиво',p:'0,5 л',k:215}, b:{img:'chicken',n:'Куриная грудка',p:'запечённая, 100 г',k:165}, cliff:true},
];
// Тайминг (секунды)
const HOOK=2.4, PAIR=6.2, CLIFF=6.6, END=4.0;
const T_PAIRS = PAIRS.map((_,i)=>HOOK+i*PAIR);
const T_END = HOOK+2*PAIR+CLIFF;
const DURATION = T_END+END;

const $=s=>document.querySelector(s);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=x=>1-Math.pow(1-x,3);
const backOut=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;

// build pair scenes
$('#pairs').innerHTML=PAIRS.map((p,i)=>`
 <div class="layer pairscene" id="ps${i}">
   <div class="lbl">ПАРА ${i+1} ИЗ 3</div>
   <div class="q">${p.q}</div>
   ${['a','b'].map((k,j)=>`<div class="row r${j+1}" id="row${i}${k}">
      <img class="ph" src="../ugaday/img/${p[k].img}.webp">
      <div class="tx"><div class="nm">${p[k].n}</div><div class="pt">${p[k].p}</div><div class="kc"><span class="v">?</span><small>ккал</small></div></div>
    </div>`).join('')}
   <div class="vs" id="vs${i}"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="none" stroke="#F8E0BC" stroke-width="4" stroke-linecap="round" id="ring${i}" transform="rotate(-90 50 50)" stroke-dasharray="295.3" stroke-dashoffset="0"/></svg><span id="cd${i}">или</span></div>
   ${p.cliff?`<div class="cliff" id="cl${i}"><div class="a gold">А тут ответ — в игре</div><div class="b">Угадаешь? Проверь себя 👇</div></div>`:`<div class="cap" id="cap${i}">${p.cap}</div>`}
 </div>`).join('');

// gold dust, deterministic
const dust=$('#dust'), dx=dust.getContext('2d');
let seed=7; const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const motes=Array.from({length:90},()=>({x:rnd()*1080,y:rnd()*1920,r:rnd()*3+1,s:rnd()*30+10,a:rnd()*.5+.15,ph:rnd()*6.28}));
function drawDust(t){ dx.clearRect(0,0,1080,1920); for(const m of motes){ const y=(m.y-t*m.s*2+1920*10)%1920; dx.fillStyle=`rgba(233,185,131,${m.a*(.6+.4*Math.sin(t*2+m.ph))})`; dx.beginPath(); dx.arc(m.x+Math.sin(t+m.ph)*12,y,m.r,0,7); dx.fill(); } }

function show(el,o,ty=0,sc=1){ el.style.opacity=o; el.style.transform=`translateY(${ty}px) scale(${sc})`; el.style.visibility=o<=0.001?'hidden':'visible'; }

function render(t){
  drawDust(t);
  // hook
  const hk=$('#hook'); const hOut=prog(t,HOOK-0.35,HOOK); hk.style.opacity=1-hOut; hk.style.display=t<HOOK?'block':'none';
  [['#h1',80,500,-1],['#h2',285,500,1],['#h3',80,690,-1],['#h4',285,690,1]].forEach(([s,x,y,d],i)=>{
    const p=backOut(prog(t,0.1+i*0.12,0.7+i*0.12)); const el=$(s);
    el.style.left=lerp(x+d*300,x,p)+'px'; el.style.top=(y+Math.sin(t*2+i)*8)+'px'; el.style.opacity=prog(t,0.1+i*0.12,0.4+i*0.12);
    el.style.transform=`rotate(${d*(1-p)*40+Math.sin(t*1.5+i)*4}deg)`;
  });
  show($('#ht1'),prog(t,0,0.35),lerp(30,0,easeOut(prog(t,0,0.5))),lerp(.9,1,backOut(prog(t,0,0.5))));
  show($('#ht2'),prog(t,0.6,0.95),lerp(20,0,easeOut(prog(t,0.6,1))));

  // pairs
  PAIRS.forEach((p,i)=>{
    const s=T_PAIRS[i], len=p.cliff?CLIFF:PAIR, lt=t-s, sc=$('#ps'+i);
    const vis = lt>=0 && lt<len; sc.style.display=vis?'block':'none';
    if(!vis) return;
    sc.style.opacity = Math.min(prog(lt,0,0.25), 1-prog(lt,len-0.3,len));
    show(sc.querySelector('.q'),prog(lt,0,0.3),lerp(16,0,easeOut(prog(lt,0,0.4))));
    const ra=$(`#row${i}a`), rb=$(`#row${i}b`);
    const ia=backOut(prog(lt,0.1,0.65)), ib=backOut(prog(lt,0.25,0.8));
    // countdown 0.8..3.8
    const cd=$('#cd'+i), ring=$('#ring'+i);
    const cdT=lt-0.8; let label='или', ringOff=0;
    if(cdT>=0 && cdT<3){ label=String(3-Math.floor(cdT)); ringOff=295.3*(cdT/3); }
    else if(cdT>=3) { label='?'; ringOff=295.3; }
    cd.textContent=label;
    const pulse = cdT>=0&&cdT<3 ? 1+0.18*Math.max(0,1-(cdT%1)*4) : 1;
    $('#vs'+i).style.transform=`scale(${pulse*backOut(prog(lt,0.2,0.6))})`;
    ring.setAttribute('stroke-dashoffset',ringOff.toFixed(1));
    // reveal 3.8..4.8
    const rv=prog(lt,3.8,4.8), done=lt>=4.8;
    const winner = p.a.k>p.b.k ? 'a':'b';
    [['a',ra,ia,-1],['b',rb,ib,1]].forEach(([k,row,inP,dir])=>{
      let scale=1, op=1, border='rgba(233,185,131,.22)', glow='none';
      if(!p.cliff && done){ const e=backOut(prog(lt,4.8,5.2)); if(k===winner){scale=lerp(1,1.04,e); border='#E9B983'; glow='0 0 0 2px #E9B983,0 20px 50px -14px rgba(227,174,118,.8)';} else {op=lerp(1,.5,e); scale=lerp(1,.97,e);} }
      row.style.transform=`translateX(${(1-inP)*dir*560}px) scale(${scale})`; row.style.opacity=op*clamp(inP*1.5); row.style.borderColor=border; row.style.boxShadow=glow;
      const v=row.querySelector('.v');
      if(p.cliff) v.textContent = lt>=3.8 ? '???' : '?';
      else v.textContent = lt<3.8 ? '?' : Math.round(p[k].k*easeOut(rv));
      let tag=row.querySelector('.tag'); if(!p.cliff && done && k===winner){ if(!tag){tag=document.createElement('div');tag.className='tag';tag.textContent='БОЛЬШЕ';row.appendChild(tag);} tag.style.opacity=prog(lt,4.8,5.0);} else if(tag) tag.remove();
    });
    if(p.cliff){ const c=$('#cl'+i); show(c,prog(lt,3.9,4.2),lerp(20,0,easeOut(prog(lt,3.9,4.4))),lerp(.85,1,backOut(prog(lt,3.9,4.4)))); }
    else { const c=$('#cap'+i); show(c,prog(lt,4.9,5.2),lerp(18,0,easeOut(prog(lt,4.9,5.3)))); }
  });

  // end
  const et=t-T_END, en=$('#end'); en.style.display=et>=0?'block':'none';
  if(et>=0){
    show($('#elogo'),prog(et,0,0.3),0,backOut(prog(et,0,0.5)));
    show($('#et1'),prog(et,0.15,0.45),lerp(20,0,easeOut(prog(et,0.15,0.6))));
    show($('#et2'),prog(et,0.4,0.7),lerp(16,0,easeOut(prog(et,0.4,0.8))));
    show($('#ebtn'),prog(et,0.7,0.95),0,backOut(prog(et,0.7,1.1))*(1+0.03*Math.sin(Math.max(0,et-1.1)*6)));
    show($('#eurl'),prog(et,0.9,1.2));
  }
}
window.DURATION=DURATION; window.render=render;
render(0);
</script>
</body>
</html>
