name: Refresh VK game statistics
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/snapshot-stats.py
      - .github/workflows/stats-snapshot.yml
permissions:
  contents: write
  pages: write
concurrency:
  group: vk-stats-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read counters
        run: python3 scripts/snapshot-stats.py
      - name: Save snapshot and rebuild Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ugaday-vk/stats-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh VK game statistics snapshot'
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
